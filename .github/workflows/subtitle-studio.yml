name: Subtitle Studio checks
on:
  pull_request:
    paths:
      - 'subtitle-studio/**'
      - '.github/workflows/subtitle-studio.yml'
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r subtitle-studio/requirements.txt pytest httpx
      - run: node --check subtitle-studio/static/app.js
      - run: python -m compileall -q subtitle-studio/app.py
      - run: python -m pytest -q tests
        working-directory: subtitle-studio
